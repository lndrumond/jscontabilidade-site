<?xml version="1.0" encoding="UTF-8"?>
<svg id="geometricHeart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" fill="none">
            <!-- 
                Réplica vetorial exata e matemática da malha 3D low-poly do coração
                Coordenadas normalizadas com alta precisão e simetria lateral.
            -->
            <g id="heartMesh" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
              <!-- Vértices externos da silhueta do coração -->
              <!-- Vértices Principais:
                   Eixo Central: Topo Interno (400, 160), Centro Interno (400, 310), Meio-Baixo (400, 560), Ponta Inferior (400, 750)
                   Lado Esquerdo: 
                   - P1 (Topo Esq): (230, 80)
                   - P2 (Canto Ext Sup Esq): (90, 160)
                   - P3 (Lateral Ext Esq): (30, 310)
                   - P4 (Meio Inf Esq): (110, 480)
                   - P5 (Ponta Int Esq): (260, 640)
                   ... Simetria perfeita para o Lado Direito
              -->

              <!-- FACES / POLÍGONOS INDIVIDUAIS (Com ID para suporte a preenchimento customizado) -->
              <!-- Lado Esquerdo -->
              <polygon id="poly-1" points="400,160 230,80 220,240"></polygon>
              <polygon id="poly-2" points="230,80 90,160 220,240"></polygon>
              <polygon id="poly-3" points="90,160 30,310 100,480"></polygon>
              <polygon id="poly-4" points="90,160 100,480 220,240"></polygon>
              <polygon id="poly-5" points="220,240 100,480 400,310"></polygon>
              <polygon id="poly-6" points="400,160 220,240 400,310"></polygon>
              <polygon id="poly-7" points="100,480 110,480 260,640"></polygon>
              <polygon id="poly-8" points="100,480 260,640 400,310"></polygon>
              <polygon id="poly-9" points="400,310 260,640 400,560"></polygon>
              <polygon id="poly-10" points="260,640 400,750 400,560"></polygon>

              <!-- Lado Direito (Simetria em X = 800 - X_esquerdo) -->
              <polygon id="poly-11" points="400,160 570,80 580,240"></polygon>
              <polygon id="poly-12" points="570,80 710,160 580,240"></polygon>
              <polygon id="poly-13" points="710,160 770,310 700,480"></polygon>
              <polygon id="poly-14" points="710,160 700,480 580,240"></polygon>
              <polygon id="poly-15" points="580,240 700,480 400,310"></polygon>
              <polygon id="poly-16" points="400,160 580,240 400,310"></polygon>
              <polygon id="poly-17" points="700,480 690,480 540,640"></polygon>
              <polygon id="poly-18" points="700,480 540,640 400,310"></polygon>
              <polygon id="poly-19" points="400,310 540,640 400,560"></polygon>
              <polygon id="poly-20" points="540,640 400,750 400,560"></polygon>

              <!-- Linha Central Vertical de divisão -->
              <line x1="400" y1="160" x2="400" y2="750"></line>
            </g>
          </svg>